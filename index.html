<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>สร้าง QR Code</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--ac:#2563eb;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f19;--card:#161b27;--tx:#f3f4f6;--mut:#9ca3af;--ac:#3b82f6;--bd:#2b3344}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sukhumvit Set","Thonburi",sans-serif;
padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
main{max-width:480px;margin:auto;background:var(--card);border-radius:16px;padding:20px;display:grid;gap:14px}
h1{font-size:1.25rem;margin:0}
textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:110px;resize:vertical}
label{font-size:.85rem;color:var(--mut)}
.box{display:grid;place-items:center;background:#fff;border-radius:12px;padding:8px;min-height:120px}
canvas{width:100%;max-width:320px;height:auto;image-rendering:pixelated}
.row{display:flex;gap:10px}
button{flex:1;font:inherit;font-size:16px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
#msg{font-size:.85rem;color:var(--mut);min-height:1.2em}
</style>
</head>
<body>
<main>
  <h1>สร้าง QR Code</h1>
  <div>
    <label for="t">ข้อความ / ลิงก์ (รองรับภาษาไทยและอีโมจิ)</label>
    <textarea id="t" placeholder="พิมพ์ข้อความหรือวางลิงก์ที่นี่"></textarea>
  </div>
  <div>
    <label for="ec">ระดับการแก้ไขข้อผิดพลาด</label>
    <select id="ec">
      <option value="L">L – ต่ำ (จุดน้อย อ่านง่าย)</option>
      <option value="M" selected>M – กลาง</option>
      <option value="Q">Q – ค่อนข้างสูง</option>
      <option value="H">H – สูง (ทนรอยเปื้อน)</option>
    </select>
  </div>
  <div class="box"><canvas id="c" width="1" height="1"></canvas></div>
  <div id="msg"></div>
  <div class="row">
    <button id="save" disabled>บันทึกรูป</button>
    <button id="clr" class="s">ล้าง</button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d');
// ให้รองรับ UTF-8 (ภาษาไทย/อีโมจิ)
qrcode.stringToBytes=s=>Array.from(new TextEncoder().encode(s));
function draw(){
  const text=$('t').value, msg=$('msg');
  msg.textContent='';
  if(!text){cv.width=cv.height=1;ctx.clearRect(0,0,1,1);$('save').disabled=true;return}
  try{
    const qr=qrcode(0,$('ec').value);
    qr.addData(text,'Byte'); qr.make();
    const n=qr.getModuleCount(), quiet=4, sc=Math.max(1,Math.floor(1024/(n+quiet*2))), size=(n+quiet*2)*sc;
    cv.width=cv.height=size;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+quiet)*sc,(r+quiet)*sc,sc,sc);
    $('save').disabled=false;
  }catch(e){
    $('save').disabled=true;cv.width=cv.height=1;
    msg.textContent='ข้อความยาวเกินไปสำหรับ QR Code ลองลดความยาวหรือลดระดับ EC';
  }
}
$('t').addEventListener('input',draw);
$('ec').addEventListener('change',draw);
$('clr').onclick=()=>{$('t').value='';draw();$('t').focus()};
$('save').onclick=()=>{
  cv.toBlob(async b=>{
    const f=new File([b],'qrcode.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='qrcode.png';
    document.body.appendChild(a);a.click();a.remove();
  },'image/png');
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
